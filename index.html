  if(tab=="data"){const s=S.set;h=`<div class="c"><h2>Instellingen</h2><div class="f"><label>Racedatum <input type="date" value="${s.race}" onchange="S.set.race=this.value;save();draw()"></label><label>Doel <input value="${esc(s.goal)}" size="7" onchange="S.set.goal=this.value;save()"></label></div><div class="f"><label>VT1 (bpm) <input type="number" value="${s.vt1}" style="width:70px" onchange="S.set.vt1=+this.value;save()"></label><label>VT2 (bpm) <input type="number" value="${s.vt2}" style="width:70px" onchange="S.set.vt2=+this.value;save()"></label></div><div class="f"><label>Max km/week <input type="number" value="${s.cap}" style="width:70px" onchange="S.set.cap=+this.value;save()"></label><label>Groei %/week <input type="number" value="${s.gr}" style="width:60px" onchange="S.set.gr=+this.value;save()"></label></div><div class="f">Weken per fase:`+PS.map((n,j)=>`<label>${n} <input type="number" value="${s.ph[j]}" style="width:55px" onchange="S.set.ph[${j}]=+this.value;save();draw()"></label>`).join("")+`</div><p class="m">Werk VT1 en VT2 bij na de test van 16 december. De fases moeten samen de weken tot Rome vullen (nu ${N}).</p></div><div class="c"><h2>Back-up</h2><p><button onclick="bk()">Exporteer back-up</button> <input type="file" accept=".json" onchange="rs(this.files[0])"></p><p class="m">Maak elke zondag een back-up; Safari kan data van weinig gebruikte sites wissen. <span class="w">${esc(msg)}</span></p></div>`}
  $("v").innerHTML=h;if(tab=="log")lf()}
function put(r){const dt=r.d.slice(0,10);if(!r.m)S.runs=S.runs.filter(x=>!(x.m&&x.d.slice(0,10)==dt&&Math.abs(x.km-r.km)/r.km<.25));const i=S.runs.findIndex(x=>x.d.slice(0,16)==r.d.slice(0,16));if(i<0)S.runs.push(r);else S.runs[i]=Object.assign(S.runs[i],r)}
function csv(t){const o=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==","){r.push(c);c=""}else if(h=="\n"){r.push(c);o.push(r);r=[];c=""}else if(h!="\r")c+=h}if(c||r.length){r.push(c);o.push(r)}return o}
const ps=s=>{const m=String(s||"").split(":");return m.length==2?+m[0]*60+ +m[1]:0};
async function imp(fl){let n=0;msg="";for(const f of fl){const t=await f.text();
  if(/\.csv$/i.test(f.name)){const Q=csv(t),H=Q[0].map(x=>x.trim()),ix=(...k)=>{for(const a of k){const i=H.indexOf(a);if(i>=0)return i}return -1},ty=ix("Activiteittype","Activity Type"),dt=ix("Datum","Date"),ds=ix("Afstand","Distance"),hs=ix("Gem. HS","Avg HR"),pc=ix("Gemiddeld tempo","Avg Pace");
    if(dt<0||ds<0){msg="Kolommen niet herkend in "+f.name;continue}
    Q.slice(1).forEach(x=>{if(!/run|loop|hardlop/i.test(x[ty]||""))return;const k=parseFloat(String(x[ds]).replace(",","."));if(!k)return;const h=parseInt(x[hs])||0,p=ps(x[pc]);put({d:x[dt].replace(" ","T"),km:k,p,hr:h,fl:h&&p&&p<390&&h<100?1:0});n++})}
  else{const X=new DOMParser().parseFromString(t,"text/xml"),id=X.getElementsByTagName("Id")[0]?.textContent;if(!id){msg="Geen geldige TCX: "+f.name;continue}
    const L=[...X.getElementsByTagName("Lap")].map(l=>{const g=k=>+(l.getElementsByTagName(k)[0]?.textContent||0),v=l.getElementsByTagName("AverageHeartRateBpm")[0]?.getElementsByTagName("Value")[0]?.textContent;return{m:g("DistanceMeters"),s:g("TotalTimeSeconds"),hr:+v||0}}).filter(l=>l.m>200),k=L.reduce((a,l)=>a+l.m,0)/1000,sec=L.reduce((a,l)=>a+l.s,0);if(!k)continue;
    const sp=L.map(l=>({p:Math.round(l.s/l.m*1000),hr:l.hr,fl:l.hr&&l.s/l.m*1000<390&&l.hr<100?1:0})),hh=L.filter(l=>l.hr),d=new Date(id);
    put({d:iso(d)+"T"+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"),km:+k.toFixed(2),p:Math.round(sec/k),hr:hh.length?Math.round(hh.reduce((a,l)=>a+l.hr*l.s,0)/hh.reduce((a,l)=>a+l.s,0)):0,sp,fl:sp.some(z=>z.fl)?1:0});n++}}
  msg=n+" runs verwerkt.";save();draw()}
function cp(){const e=$("pr");e.select();try{navigator.clipboard.writeText(e.value).then(()=>{msg="Gekopieerd.";draw()},()=>{document.execCommand("copy");msg="Gekopieerd."})}catch(x){document.execCommand("copy");msg="Gekopieerd."}}
function bk(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="pacelab-backup-"+iso(new Date())+".json";a.click()}
async function rs(f){if(!f)return;try{S=Object.assign(S,JSON.parse(await f.text()));save();msg="Hersteld.";draw()}catch(e){msg="Ongeldig bestand."}}

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
draw();
</script></body></html>
